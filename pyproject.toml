[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promvector-agent"
version = "0.1.0"
description = "Standalone read-only industrial telemetry agent for PromVector"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "platformdirs>=4,<5",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "asyncua>=1.1.8,<2",
  "pymodbus>=3.11,<4",
  "psycopg[binary]>=3.2,<4",
  "google-genai>=1.50,<3",
  "PySide6-Essentials>=6.8,<6.12",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "trustme>=1.2,<2"]
package = ["pyinstaller>=6.14,<7"]

[project.scripts]
promvector-agent = "promvector_agent.cli:main"

[tool.setuptools.packages.find]
include = ["promvector_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
